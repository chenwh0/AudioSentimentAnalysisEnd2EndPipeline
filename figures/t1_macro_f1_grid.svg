  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(5.76 10.615414)">Macro-F1 of each speech-to-text x sentiment pair on the test slice. Swapping the speech model moves</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(5.76 22.618148)">Cardiff by about 0.02; swapping the sentiment model moves it by about 0.3. Error bars: 95% bootstrap CI</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans', sans-serif; fill: #0b0b0b" transform="translate(5.76 34.620883)">(10,000 resamples).</text>
  </g>
  <g id="text_22">
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans', sans-serif; fill: #898781" transform="translate(5.76 389.629459)">Macro-F1 = the plain average of the F1 score for each of the three sentiment classes (negative, neutral, positive), so</text>
   <text style="font-size: 7.5px; font-family: 'DejaVu Sans', sans-serif; fill: #898781" transform="translate(5.76 398.63151)">the rare negative class counts as much as the common neutral one.</text>
  </g>
 </g>
